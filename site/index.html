<!DOCTYPE html>

  <!-- Apply saved theme ASAP to avoid flash -->
  <script>
(() => {
  const saved = localStorage.getItem('porydex-theme') || 'dark';
  const root = document.documentElement;
  root.classList.remove('dark-mode', 'theme-azure', 'theme-dex', 'theme-dark', 'theme-light');
  if (saved === 'dark') {
    root.classList.add('dark-mode');
  } else if (saved === 'azure') {
    root.classList.add('dark-mode', 'theme-azure');
  } else if (saved === 'dex') {
    root.classList.add('theme-dex');
  } // light = no classes
})();
</script>

  <!-- Theme logic -->
  <script>
(function () {
  const el = document.getElementById('themeSelect');
  init();
  el.addEventListener('change', () => setTheme(el.value));

  function init() {
    const saved = localStorage.getItem('porydex-theme') || 'dark';
    setTheme(saved);
    el.value = saved;
  }

  function setTheme(name) {
    const root = document.documentElement;
    root.classList.remove('dark-mode', 'theme-light', 'theme-azure', 'theme-dark', 'theme-dex');

    if (name === 'light') {
      root.classList.add('theme-light');
    } else if (name === 'azure') {
      root.classList.add('dark-mode', 'theme-azure');
    } else if (name === 'dex') {
      root.classList.add('theme-dex');
    } else {
      root.classList.add('theme-dark');
    }
    try { localStorage.setItem('porydex-theme', name); } catch {}
  }
})();
</script>

<script>
(() => {
  const select = document.getElementById('themeSelect');
  const root = document.documentElement;

  // initialize dropdown from saved value
  const saved = localStorage.getItem('porydex-theme') || 'dark';
  select.value = saved;
  apply(saved);

  select.addEventListener('change', () => {
    const val = select.value;
    apply(val);
    localStorage.setItem('porydex-theme', val);
  });

  function apply(mode) {
    root.classList.remove('dark-mode', 'theme-azure', 'theme-dex', 'theme-dark', 'theme-light');
    if (mode === 'dark') {
      root.classList.add('dark-mode');
    } else if (mode === 'azure') {
      root.classList.add('dark-mode', 'theme-azure');
    } else if (mode === 'dex') {
      root.classList.add('theme-dex');
    }
    // light: no classes
  }
})();
</script>
